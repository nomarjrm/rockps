<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piedra, Papel o Tijeras</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body class="bg-sky-100 text-slate-800 p-6 flex flex-col items-center min-h-screen">
    <div class="w-full max-w-xl flex flex-col gap-6">
      <h1 class="text-3xl font-extrabold text-center text-blue-900">Piedra, Papel o Tijeras</h1>

      <div class="grid grid-cols-3 gap-4 bg-white p-6 rounded-2xl shadow-md items-center text-center">
        <div class="flex flex-col gap-4">
          <h2 class="text-xl font-bold text-blue-900">P1 (Tú)</h2>
          <div id="controls" class="flex flex-col gap-2">
            <button data-choice="Piedra" class="choice-btn bg-blue-900 text-white rounded-xl px-4 py-2 hover:bg-blue-800 cursor-pointer transition font-medium">🧱 Piedra</button>
            <button data-choice="Papel" class="choice-btn bg-blue-900 text-white rounded-xl px-4 py-2 hover:bg-blue-800 cursor-pointer transition font-medium">📄 Papel</button>
            <button data-choice="Tijeras" class="choice-btn bg-blue-900 text-white rounded-xl px-4 py-2 hover:bg-blue-800 cursor-pointer transition font-medium">✂️ Tijeras</button>
          </div>
        </div>

        <div id="result-container" class="flex flex-col items-center justify-center p-3 bg-sky-50 rounded-xl border border-blue-200 shadow-inner">
          <span class="text-xs font-semibold text-slate-500 uppercase">Ganador</span>
          <h2 id="winner-text" class="text-sm font-bold mt-1 text-blue-900">¡A Jugar!</h2>
        </div>

        <div class="flex flex-col items-center justify-center gap-4 border-l border-slate-200 pl-4">
          <h2 class="text-xl font-bold text-blue-900">CPU</h2>
          <div id="cpu-display" class="text-4xl font-bold bg-sky-50 w-20 h-20 flex items-center justify-center rounded-full border-2 border-blue-900 text-blue-900 shadow-sm">
            ?
          </div>
        </div>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-md flex flex-col gap-3">
        <h3 class="text-xl font-bold text-blue-900">Historial (Últimas partidas)</h3>
        <ul id="history-list" class="flex flex-col gap-2">
          <p class="text-slate-400 text-sm">Aún no hay partidas registradas.</p>
        </ul>
      </div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
